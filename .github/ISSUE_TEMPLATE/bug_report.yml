name: Bug Report
description: Report a reproducible defect in SwapMid backend, BFF console, or Docker stack
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Component
      options:
        - DataIntegration (Connectors / Streaming ETL / Target Receipt v1)
        - MessageBus (Topics / Subscriptions / Webhook / RabbitMQ / BotWebhook)
        - ApiManagement (Gateway / Routes / OpenIddict Client Credentials)
        - Platform Core (Scheduling / Account / Enterprise / System / Notification / Docs)
        - Web Console & BFF (Next.js 16)
        - Docker Compose / CI / Tooling
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Concise description of the actual behavior vs. expected behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start stack via ...
        2. Configure ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      render: shell

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, .NET / Node / Docker version, commit SHA"
