name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10 + PostgreSQL 18 Contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SwapMidCiOnly_2026!
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SwapMid.slnx

      - name: Build (warnings as errors)
        run: dotnet build SwapMid.slnx --no-restore -c Release --nologo

      - name: Start PostgreSQL 18 logical replication container for CDC contracts
        run: |
          docker run -d --name postgres-cdc \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=SwapMidCiOnly_2026! \
            -e POSTGRES_DB=postgres \
            -p 55432:5432 \
            postgres:18-alpine \
            -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
          for i in $(seq 1 30); do
            if docker exec postgres-cdc pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Start SQL Server 2022 container for Change Tracking CDC contracts
        run: |
          docker run -d --name mssql-cdc \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='SwapMidCiOnly_Sql2022!' \
            -e MSSQL_PID=Developer \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 45); do
            if docker exec mssql-cdc /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P 'SwapMidCiOnly_Sql2022!' -C -Q "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Start MySQL 8.4 container for Binlog ROW CDC contracts
        run: |
          docker run -d --name mysql-cdc \
            -e MYSQL_ROOT_PASSWORD='SwapMidCiOnly_MySql84!' \
            -e MYSQL_DATABASE=swapmid_cdc \
            -p 3306:3306 \
            mysql:8.4 \
            --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL
          for i in $(seq 1 45); do
            if docker exec mysql-cdc mysqladmin ping -h 127.0.0.1 -uroot -p'SwapMidCiOnly_MySql84!' --silent >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Run unit, architecture, PostgreSQL 18, SQL Server 2022 & MySQL 8.4 contract test suites
        env:
          SWAPMID_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=SwapMidCiOnly_2026!
          SWAPMID_RUN_POSTGRES_CONTRACT_TESTS: '1'
          SWAPMID_POSTGRES_CDC_TEST_CONNECTION: Host=127.0.0.1;Port=55432;Database=postgres;Username=postgres;Password=SwapMidCiOnly_2026!
          SWAPMID_RUN_POSTGRES_CDC_CONTRACT_TESTS: '1'
          SWAPMID_SQLSERVER_TEST_CONNECTION: Server=127.0.0.1,1433;User Id=sa;Password=SwapMidCiOnly_Sql2022!;TrustServerCertificate=True;Encrypt=False
          SWAPMID_MYSQL_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=swapmid_cdc;User ID=root;Password=SwapMidCiOnly_MySql84!;SslMode=Preferred;AllowPublicKeyRetrieval=True
        run: dotnet test SwapMid.slnx --no-build -c Release --nologo --verbosity normal

      - name: Stop CDC database containers
        if: always()
        run: docker rm -f postgres-cdc mssql-cdc mysql-cdc >/dev/null 2>&1 || true

  frontend:
    name: Frontend (Next.js 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Dependency & architecture boundaries (Knip + Dependency Cruiser)
        run: pnpm check:deps

      - name: Supply-chain security contracts
        run: pnpm test:security-deps

      - name: ESLint (zero warnings) & i18n contracts
        run: pnpm lint

      - name: UI governance health check
        run: pnpm check:ui

      - name: OpenAPI summary & generated SDK cleanliness check
        run: |
          pnpm check:api-summary
          pnpm verify:api:clean

      - name: Unit & contract tests (Vitest)
        run: pnpm test:run

      - name: Production standalone build
        run: pnpm build

  compose:
    name: Docker Compose & Full-Stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Validate docker-compose manifests & Helm chart
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example config --quiet
          GRAFANA_ADMIN_PASSWORD=ci-placeholder docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml --env-file docker/.env.example config --quiet
          helm lint charts/swapmid --set secret.existingSecret=ci-placeholder
          helm template swapmid charts/swapmid --set secret.existingSecret=ci-placeholder >/dev/null

      - name: Build production container images (migrator, api, web)
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example build migrator
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example build api
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example build web

      - name: Boot full stack & run end-to-end smoke suite
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example up -d
          node scripts/e2e-smoke.mjs

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml --env-file docker/.env.example logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/docker-compose.yml --env-file docker/.env.example down -v
