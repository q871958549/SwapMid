global:
  resolve_timeout: 5m

route:
  receiver: swapmid-notification-center
  group_by: ['alertname', 'engine', 'severity']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: swapmid-notification-center
    webhook_configs:
      - url: "http://api:8080/api/v1/notification/webhooks/alertmanager?token=swapmid-local-alert-token"
        send_resolved: true
