groups:
  - name: swapmid.integration.engines
    rules:
      - alert: SwapMidEtlOutcomeUnknownDetected
        expr: increase(swapmid_etl_execution_results_total{result="outcome_unknown"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          engine: data-integration
        annotations:
          summary: "ETL execution entered OutcomeUnknown quarantine"
          description: "At least one DataIntegration pipeline execution entered OutcomeUnknown in the last 5 minutes. Automatic retries are blocked; verify Target Receipt v1 or reconcile manually before re-running."

      - alert: SwapMidEtlExecutionFailures
        expr: increase(swapmid_etl_execution_results_total{result="failed"}[10m]) >= 3
        for: 2m
        labels:
          severity: warning
          engine: data-integration
        annotations:
          summary: "Repeated DataIntegration ETL failures"
          description: "3 or more ETL executions failed within 10 minutes."

      - alert: SwapMidMessageBusDeliveryFailures
        expr: rate(swapmid_message_delivery_total{result="failure"}[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          engine: message-bus
        annotations:
          summary: "Elevated MessageBus delivery failure rate"
          description: "Outbound subscription deliveries are failing at > 0.1/sec over 5m; inspect dead-letter queue and subscriber endpoints."

      - alert: SwapMidApiGateway5xxSpike
        expr: sum(rate(swapmid_gateway_requests_total{status_class="5xx"}[5m])) > 0.2
        for: 2m
        labels:
          severity: warning
          engine: api-gateway
        annotations:
          summary: "Managed API Gateway 5xx error spike"
          description: "Upstream forwarding or SSRF/timeout rejections exceeded 0.2 req/s over 5 minutes."

      - alert: SwapMidHangfireJobExhausted
        expr: increase(swapmid_hangfire_jobs_failed_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          engine: scheduling
        annotations:
          summary: "Hangfire background job exhausted retries"
          description: "A background job entered FailedState after exhausting retries."

      - alert: SwapMidDatabaseCommandFailures
        expr: increase(swapmid_ef_commands_failed_total[5m]) >= 5
        for: 1m
        labels:
          severity: critical
          engine: platform-db
        annotations:
          summary: "EF Core database command failures detected"
          description: "5 or more EF Core SQL commands failed or timed out in the last 5 minutes."

      - alert: SwapMidCdcCaptureFailures
        expr: increase(swapmid_cdc_captures_total{result="failed"}[10m]) >= 2
        for: 1m
        labels:
          severity: warning
          engine: data-integration-cdc
        annotations:
          summary: "PostgreSQL pgoutput CDC capture failures detected"
          description: "2 or more CDC WAL capture attempts failed within 10 minutes; inspect pre-flight diagnostics and upstream PostgreSQL replication status."

      - alert: SwapMidCdcWalLagHigh
        expr: max(swapmid_cdc_wal_lag_bytes) > 104857600
        for: 5m
        labels:
          severity: warning
          engine: data-integration-cdc
        annotations:
          summary: "PostgreSQL CDC replication slot retained WAL lag above 100 MiB"
          description: "At least one pgoutput replication slot has retained more than 100 MiB of WAL; verify active polling or release unused slots."

      - alert: SwapMidCdcSchemaDriftDetected
        expr: increase(swapmid_cdc_schema_drift_events_total{action=~"warn|paused"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          engine: data-integration-cdc
        annotations:
          summary: "Upstream PostgreSQL CDC schema drift detected"
          description: "At least one monitored CDC source table changed columns or types; affected PauseAndAlert streams were paused automatically pending operator confirmation."

      - alert: SwapMidCdcDataContractBreached
        expr: increase(swapmid_cdc_contract_evaluations_total{outcome="breached"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          engine: data-integration-cdc
        annotations:
          summary: "CDC stream Data Contract SLA breached"
          description: "One or more CDC streams breached freshness lag, required columns, schema drift, or WAL retention byte budgets in the last 10 minutes."

      - alert: SwapMidCdcIcebergCommitFailures
        expr: increase(swapmid_cdc_iceberg_commits_total{outcome="failed"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          engine: data-integration-cdc
        annotations:
          summary: "Apache Iceberg v2 metadata commit failures detected"
          description: "One or more Iceberg v2 optimistic CAS commits failed after exhausting retries in the last 15 minutes; inspect S3/MinIO availability and concurrent writers."

      - alert: SwapMidCdcWebhookAuthFailuresSpike
        expr: increase(swapmid_cdc_webhook_ingests_total{outcome="rejected_auth"}[10m]) >= 10
        for: 1m
        labels:
          severity: warning
          engine: data-integration-cdc
        annotations:
          summary: "Push Webhook CDC HMAC authentication rejection spike"
          description: "10 or more Push Webhook CDC requests failed HMAC-SHA256 verification within 10 minutes; check upstream signing secret configuration or unauthorized callers."

      - alert: SwapMidCdcWebhookDeliveryFailures
        expr: increase(swapmid_cdc_webhook_ingests_total{outcome="failed"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          engine: data-integration-cdc
        annotations:
          summary: "Push Webhook CDC downstream delivery failures"
          description: "One or more authenticated Push Webhook CDC batches failed downstream delivery in the last 15 minutes; inspect webhook delivery ledger and replay failed batches."

      - alert: SwapMidCdcKafkaLagHigh
        expr: swapmid_cdc_kafka_lag_messages > 10000
        for: 5m
        labels:
          severity: warning
          engine: data-integration-cdc
        annotations:
          summary: "Kafka Debezium CDC consumer lag above 10,000 messages"
          description: "Kafka Debezium CDC stream {{ $labels.stream }} has more than 10,000 unconsumed messages for 5 minutes; inspect MaxBatchSize, PollIntervalSeconds, or downstream sink latency."
