name: Release & Multi-Arch GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override for manual workflow dispatch (e.g. edge or v0.2.0-rc.1)'
        required: false
        default: 'edge'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build & Push Multi-Arch Image (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: migrator
            context: .
            dockerfile: src/SwapMid.DbMigrator/Dockerfile
          - component: api
            context: .
            dockerfile: src/SwapMid.HttpApi.Host/Dockerfile
          - component: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize lowercase repository owner
        id: meta_owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata & tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.meta_owner.outputs.owner }}/swapmid-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag || 'edge' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Build and push multi-arch OCI image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=swapmid-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=swapmid-${{ matrix.component }}

  helm-chart:
    name: Package & Push Helm Chart (GHCR OCI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Normalize lowercase repository owner
        id: meta_owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Lint, package & push Helm chart
        run: |
          helm lint charts/swapmid --set secret.existingSecret=ci-placeholder
          RAW_TAG="${{ github.event_name == 'workflow_dispatch' && (inputs.tag || '0.0.0-edge') || github.ref_name }}"
          CHART_VERSION="${RAW_TAG#v}"
          if [[ "${CHART_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            helm package charts/swapmid --version "${CHART_VERSION}" --app-version "${CHART_VERSION}" --destination /tmp/charts
          else
            helm package charts/swapmid --destination /tmp/charts
          fi
          helm push /tmp/charts/swapmid-*.tgz "oci://ghcr.io/${{ steps.meta_owner.outputs.owner }}/charts"

  github-release:
    name: Create GitHub Release
    needs: [images, helm-chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" \
            --title "SwapMid ${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
