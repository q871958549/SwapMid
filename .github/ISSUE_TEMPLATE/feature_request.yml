name: Feature Request
description: Propose a new connector, delivery channel, gateway capability, or DX improvement
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Target Area
      options:
        - DataIntegration
        - MessageBus
        - ApiManagement
        - Platform Core / Scheduling / Notification
        - Web Console & BFF
        - Deployment / Observability / Docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What integration or operational scenario does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Design
      description: Describe the desired API, connector behavior, UI workflow, or configuration contract.
    validations:
      required: true
