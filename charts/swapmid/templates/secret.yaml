{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swapmid.fullname" . }}-secrets
  labels:
    {{- include "swapmid.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secret.postgresPassword is required when secret.existingSecret is unset" .Values.secret.postgresPassword | quote }}
  rabbitmq-password: {{ required "secret.rabbitMqPassword is required when secret.existingSecret is unset" .Values.secret.rabbitMqPassword | quote }}
  openiddict-pfx-pass: {{ required "secret.openIddictPfxPass is required when secret.existingSecret is unset" .Values.secret.openIddictPfxPass | quote }}
  string-encryption-passphrase: {{ required "secret.stringEncryptionPassphrase is required when secret.existingSecret is unset" .Values.secret.stringEncryptionPassphrase | quote }}
  next-server-actions-key: {{ .Values.secret.nextServerActionsKey | quote }}
  external-oidc-client-secret: {{ .Values.secret.externalOidcClientSecret | quote }}
{{- end }}
