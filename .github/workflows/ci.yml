name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10 + PostgreSQL 18 Contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SwapMidCiOnly_2026!
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SwapMid.slnx

      - name: Build (warnings as errors)
        run: dotnet build SwapMid.slnx --no-restore -c Release --nologo

      - name: Run unit, architecture & PostgreSQL 18 contract test suites
        env:
          SWAPMID_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=SwapMidCiOnly_2026!
          SWAPMID_RUN_POSTGRES_CONTRACT_TESTS: '1'
        run: dotnet test SwapMid.slnx --no-build -c Release --nologo --verbosity normal

  frontend:
    name: Frontend (Next.js 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Dependency & architecture boundaries (Knip + Dependency Cruiser)
        run: pnpm check:deps

      - name: Supply-chain security contracts
        run: pnpm test:security-deps

      - name: ESLint (zero warnings) & i18n contracts
        run: pnpm lint

      - name: UI governance health check
        run: pnpm check:ui

      - name: OpenAPI summary & generated SDK cleanliness check
        run: |
          pnpm check:api-summary
          pnpm verify:api:clean

      - name: Unit & contract tests (Vitest)
        run: pnpm test:run

      - name: Production standalone build
        run: pnpm build

  compose:
    name: Docker Compose & Full-Stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate docker-compose manifests & Helm chart
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example config --quiet
          GRAFANA_ADMIN_PASSWORD=ci-placeholder docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml --env-file docker/.env.example config --quiet
          helm lint charts/swapmid
          helm template swapmid charts/swapmid >/dev/null

      - name: Build production container images (migrator, api, web)
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example build migrator
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example build api
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example build web

      - name: Boot full stack & run end-to-end smoke suite
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.example up -d
          node scripts/e2e-smoke.mjs

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml --env-file docker/.env.example logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/docker-compose.yml --env-file docker/.env.example down -v
